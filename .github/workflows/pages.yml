name: Publish DF Pet Care
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml', 'tools/validate_static.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check pages and assets
        run: python3 tools/validate_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
